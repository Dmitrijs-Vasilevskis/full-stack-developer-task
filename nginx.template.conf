server {
    listen 80;
    server_name _;  # Use this to listen on all domains or use your actual domain name

    root /var/www/public;  # Path to the public directory of your PHP project
    index index.php index.html index.htm;

    # Main location block for handling requests
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP handling
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;  # PHP-FPM is running on port 9000
        fastcgi_param SCRIPT_FILENAME /var/www/public$document_root$fastcgi_script_name;  # Ensure proper path to index.php
        fastcgi_param DOCUMENT_ROOT /var/www/public;  # Document root for PHP-FPM
        include fastcgi_params;
    }

    # Block access to .ht files (if any)
    location ~ /\.ht {
        deny all;
    }

    # Allow static files to be served directly (CSS, JS, images)
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|ttf|woff|woff2)$ {
        try_files $uri =404;
    }
}
